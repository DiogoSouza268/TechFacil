<header>
    <button type="button" (click)="voltar()" title="Voltar para o Login">&#x1F868;</button>
    <div>
        <h2>Criar Conta</h2>
        <p>Preencha as informações para continuar</p>
    </div>
</header>

<main>
    <form (ngSubmit)="cadastrar()" autocomplete="off">

        <label for="nome-completo" style="padding-top: 15px;">Nome Completo</label>
        <div class="inputes">
            <span>&#128100;</span>
            <input type="text" id="nome-completo" name="nomeCompleto" [(ngModel)]="nome" required placeholder="Digite seu nome completo">
        </div>

        <label for="email" style="padding-top: 15px;">E-mail</label>
        <div class="inputes">
            <span>&#x1F4E7;</span>
            <input type="email" id="email" name="email" [(ngModel)]="email" required placeholder="Digite seu email">
        </div>
        
        <label for="password" style="padding-top: 15px;">Senha</label>
        <div class="inputes">
            <span>&#x1F512;</span>
            <input type="password" id="password" maxlength="8" name="password" [(ngModel)]="senha" required placeholder="Digite sua senha">
        </div>

        <label for="repete-password" style="padding-top: 15px;">Confirmar Senha</label>
        <div class="inputes">
            <span>&#x1F512;</span>
            <input type="password" id="repete-password" maxlength="8" name="repetePassword" [(ngModel)]="confirmarSenha" required placeholder="Confirme sua senha">
        </div>

        <section id="Termos">
            <input type="checkbox" id="termos" name="aceitouTermos" [(ngModel)]="aceitouTermos">
            <p>Li e concordo com os termos e condições. <a href="javascript:void(0)">Ler termos</a></p>
        </section>

        <button type="submit" style="margin-top: 15px;">Criar Conta &#x2192;</button>
    </form>

    <p id="texto-final">Já tem conta? <a routerLink="/login">Entrar</a></p>
</main>
