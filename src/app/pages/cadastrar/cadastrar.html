<header>
    <button>&#x1F868;</button>
    <div>
        <h2>Criar Conta</h2>
        <p>Preencha as informações para continuar</p>
    </div>
</header>

<main>
    <form autocomplete="off">

        <label for="nome-completo" style="padding-top: 15px;">Nome Completo</label>
        <div class="inputes">
            <span>&#128100;</span>
            <input type="text" id="nome-completo" name="nome-completo" required placeholder="Digite seu nome completo">
        </div>

        <label for="email" style="padding-top: 15px;">E-mail</label>
        <div class="inputes">
            <span>&#x1F4E7;</span>
            <input type="email" id="email" name="email" required placeholder="Digite seu email">
        </div>
        
        <label for="password" style="padding-top: 15px;" >Senha</label>
        <div class="inputes">
            <span>&#x1F512;</span>
            <input type="password" id="password" maxlength="8" name="password" required placeholder="Digite sua senha">
        </div>

        <label for="repete-password" style="padding-top: 15px;" >Confirmar Senha</label>
        <div class="inputes">
            <span>&#x1F512;</span>
            <input type="password" id="repete-password" maxlength="8" name="repete-password" required placeholder="Confirme sua senha">
        </div>

    </form>

    <section id="Termos">
        <input type="checkbox" name="" id="">
        <p>Li e concordo com os termos e condições. <a href="">Ler termos</a></p>
    </section>

    <button type="submit" style="margin-top: 15px;">Entrar &#x2192;</button>

    <p id="texto-final">Já tem conta? <a routerLink = "/dashboard">Entrar</a></p>



</main>
