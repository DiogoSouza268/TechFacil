<header>
    <img src="/img/facilito.svg" alt="Logo da TechFacil">
    <h2>Oi! Eu sou o Facilito</h2>
    <p>Vou te ajudar a escolher o aparelho ideal</p>
</header>

<main>
    <section id="main-txt">
        <h2>Entrar na sua conta</h2>
        <p>Acesse para salvar suas preferências</p>
    </section>

    <form autocomplete="off">
        <label for="email">E-mail</label>
        <div class="inputes">
            <span>&#x1F4E7;</span>
            <input type="email" id="email" name="email" required placeholder="Digite seu email">
        </div>
        
        <label for="password" style="padding-top: 15px;" >Senha</label>
        <div class="inputes">
            <span>&#x1F512;</span>
            <input type="password" id="password" maxlength="8" name="password" required placeholder="Digite sua senha">
        </div>

        <button type="submit" style="margin-top: 15px;">Entrar &#x2192;</button>
        <button type="submit" style="margin-top: 10px;">Continuar como Anônimo</button>
    </form>

    <section id="main-txt2">
        <a href="">Esqueci minha senha</a>
        <p>Novo por aqui? <a routerLink = "/dashboard">Crie sua conta agora</a></p>
    </section>
</main>
